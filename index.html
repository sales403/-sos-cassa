<!-- =========================================================
     SOS RIDER - SPLASH SCREEN ANIMATA
     Incolla tutto questo SUBITO DOPO <body>
========================================================= -->

<style>
  /* BLOCCA LO SCROLL DURANTE LA SPLASH */
  body.sos-splash-active {
    overflow: hidden;
  }

  /* CONTENITORE SPLASH */
  #sosSplash {
    position: fixed;
    inset: 0;
    z-index: 999999;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
      radial-gradient(
        circle at center,
        rgba(255, 204, 0, 0.08) 0%,
        rgba(0, 0, 0, 0) 48%
      ),
      #050505;

    overflow: hidden;

    opacity: 1;
    visibility: visible;
  }

  /* LINEA GIALLA CENTRALE / FLASH */
  #sosSplash::before {
    content: "";
    position: absolute;

    width: 0%;
    height: 3px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: #ffd000;

    box-shadow:
      0 0 10px rgba(255, 208, 0, 0.9),
      0 0 30px rgba(255, 208, 0, 0.8),
      0 0 60px rgba(255, 208, 0, 0.5);

    opacity: 0;

    animation: sosFlashLine 0.65s ease-out 0.35s forwards;
  }

  /* PICCOLO BAGLIORE DI SFONDO */
  #sosSplash::after {
    content: "";
    position: absolute;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(255, 208, 0, 0.16) 0%,
        rgba(255, 208, 0, 0.05) 35%,
        rgba(255, 208, 0, 0) 70%
      );

    opacity: 0;

    transform: scale(0.4);

    animation: sosGlowPulse 1s ease-out 0.25s forwards;
  }

  /* WRAPPER LOGO */
  .sos-splash-content {
    position: relative;
    z-index: 3;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    transform: translateZ(0);
  }

  /* LOGO */
  .sos-splash-logo {
    width: min(68vw, 300px);
    height: auto;

    opacity: 0;

    transform:
      scale(0.60)
      translateY(18px);

    filter:
      drop-shadow(0 0 0 rgba(255, 208, 0, 0));

    animation:
      sosLogoEnter 0.78s cubic-bezier(.18,.85,.25,1.15) forwards;
  }

  /* TESTO SOTTO */
  .sos-splash-location {
    margin-top: 12px;

    color: #ffd000;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 5px;

    opacity: 0;

    transform: translateY(8px);

    text-shadow:
      0 0 10px rgba(255, 208, 0, 0.25);

    animation:
      sosTextEnter 0.35s ease-out 0.58s forwards;
  }

  /* PAYOFF */
  .sos-splash-payoff {
    margin-top: 7px;

    color: rgba(255,255,255,0.72);

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1.5px;

    opacity: 0;

    animation:
      sosTextEnter 0.35s ease-out 0.72s forwards;
  }

  /* USCITA SPLASH */
  #sosSplash.sos-splash-out {
    animation:
      sosSplashOut 0.42s ease forwards;
  }


  /* ==============================
     ANIMAZIONI
  ============================== */

  @keyframes sosLogoEnter {

    0% {
      opacity: 0;

      transform:
        scale(0.60)
        translateY(18px);

      filter:
        drop-shadow(0 0 0 rgba(255,208,0,0));
    }

    55% {
      opacity: 1;

      transform:
        scale(1.07)
        translateY(0);

      filter:
        drop-shadow(0 0 28px rgba(255,208,0,0.65));
    }

    78% {
      transform:
        scale(0.98);

      filter:
        drop-shadow(0 0 16px rgba(255,208,0,0.45));
    }

    100% {
      opacity: 1;

      transform:
        scale(1);

      filter:
        drop-shadow(0 0 10px rgba(255,208,0,0.30));
    }
  }


  @keyframes sosTextEnter {

    from {
      opacity: 0;
      transform: translateY(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }


  @keyframes sosFlashLine {

    0% {
      width: 0%;
      opacity: 0;
    }

    25% {
      opacity: 1;
    }

    70% {
      width: 100%;
      opacity: 0.7;
    }

    100% {
      width: 100%;
      opacity: 0;
    }
  }


  @keyframes sosGlowPulse {

    0% {
      opacity: 0;
      transform: scale(0.4);
    }

    45% {
      opacity: 1;
      transform: scale(1);
    }

    100% {
      opacity: 0.25;
      transform: scale(1.3);
    }
  }


  @keyframes sosSplashOut {

    0% {
      opacity: 1;
      visibility: visible;
    }

    100% {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  }


  /* ACCESSIBILITÀ:
     se l'utente ha ridotto le animazioni */
  @media (prefers-reduced-motion: reduce) {

    .sos-splash-logo,
    .sos-splash-location,
    .sos-splash-payoff,
    #sosSplash::before,
    #sosSplash::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
    }

  }
</style>


<!-- SPLASH -->
<div id="sosSplash">

  <div class="sos-splash-content">

    <img
      class="sos-splash-logo"
      src="logo-sos-rider.png"
      alt="SOS Rider Carpi-Soliera"
    >

    <div class="sos-splash-location">
      CARPI · SOLIERA
    </div>

    <div class="sos-splash-payoff">
      IL TUO RIDER DI EMERGENZA
    </div>

  </div>

</div>


<script>
(function () {

  const splash = document.getElementById("sosSplash");

  if (!splash) return;

  document.body.classList.add("sos-splash-active");


  /*
   * DURATA SPLASH
   *
   * 1500 = 1,5 secondi
   *
   * Se la vuoi:
   *
   * più veloce  -> 1200
   * normale     -> 1500
   * più scenica -> 1800
   */

  const SPLASH_DURATION = 1500;


  function closeSplash() {

    splash.classList.add("sos-splash-out");

    document.body.classList.remove("sos-splash-active");


    /*
     * Aspettiamo che finisca il fade
     * e poi eliminiamo completamente
     * la splash dal DOM.
     */

    setTimeout(() => {

      if (splash && splash.parentNode) {
        splash.parentNode.removeChild(splash);
      }

    }, 450);

  }


  /*
   * Parte il timer solo quando
   * la pagina è effettivamente caricata.
   */

  if (document.readyState === "complete") {

    setTimeout(closeSplash, SPLASH_DURATION);

  } else {

    window.addEventListener("load", function () {

      setTimeout(closeSplash, SPLASH_DURATION);

    }, { once: true });

  }


  /*
   * SICUREZZA:
   * se per qualsiasi motivo il load
   * dovesse avere problemi,
   * la splash viene comunque rimossa.
   */

  setTimeout(function () {

    if (
      document.body.contains(splash) &&
      !splash.classList.contains("sos-splash-out")
    ) {

      closeSplash();

    }

  }, 3500);

})();
</script>
