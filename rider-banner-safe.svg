<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460" role="img" aria-labelledby="t d">
<title id="t">SOS Rider · Centro operativo</title>
<desc id="d">Banner compatto SOS Rider con rider su e-bike, richieste, consegne e cassa.</desc>
<defs>
  <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#090a0b"/><stop offset=".62" stop-color="#17191b"/><stop offset="1" stop-color="#0a0b0c"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffe100"/><stop offset="1" stop-color="#f3b700"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000" flood-opacity=".32"/></filter>
</defs>
<g filter="url(#shadow)">
  <rect x="28" y="88" width="1408" height="292" rx="52" fill="url(#panel)" stroke="#ffd000" stroke-width="6"/>
  <path d="M44 124H970" stroke="#ffd000" stroke-width="3" opacity=".58"/>
  <path d="M44 344H1015" stroke="#ffd000" stroke-width="3" opacity=".42"/>
</g>
<g opacity=".9" fill="url(#gold)">
  <path d="M718 132h330l-86 14H690z"/>
  <path d="M742 163h358l-125 12H714z" opacity=".65"/>
  <path d="M774 194h280l-116 10H749z" opacity=".5"/>
</g>

<!-- brand badge -->
<g transform="translate(66 139)">
  <path d="M28 18h184l36 46-29 121H29L0 104z" fill="#101214" stroke="#ffd000" stroke-width="6"/>
  <path d="M194 0l-31 57h35l-49 76 16-52h-35z" fill="#ffd000" stroke="#111" stroke-width="3"/>
  <text x="109" y="92" text-anchor="middle" font-family="Arial Black,Inter,Arial,sans-serif" font-size="74" font-style="italic" font-weight="900" fill="#fff">SOS</text>
  <text x="111" y="146" text-anchor="middle" font-family="Arial Black,Inter,Arial,sans-serif" font-size="48" font-style="italic" font-weight="900" fill="#ffd000">RIDER</text>
  <text x="110" y="174" text-anchor="middle" font-family="Arial,Inter,sans-serif" font-size="15" font-weight="800" letter-spacing="4" fill="#fff">CARPI-SOLIERA</text>
</g>

<!-- text -->
<g transform="translate(340 126)">
  <path d="M0 0h425l-34 62H0z" fill="url(#gold)"/>
  <text x="28" y="43" font-family="Arial Black,Inter,Arial,sans-serif" font-size="37" font-style="italic" font-weight="900" fill="#0b0c0d" letter-spacing="2">CENTRO OPERATIVO</text>
  <text x="5" y="126" font-family="Arial Black,Inter,Arial,sans-serif" font-size="61" font-style="italic" font-weight="900" fill="#fff">Gestione richieste,</text>
  <text x="5" y="192" font-family="Arial Black,Inter,Arial,sans-serif" font-size="61" font-style="italic" font-weight="900" fill="#ffd000">consegne <tspan fill="#fff">e cassa.</tspan></text>
  <text x="12" y="243" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="500" letter-spacing="5" fill="#c8c9ca">Carpi · Limidi · Soliera</text>
</g>

